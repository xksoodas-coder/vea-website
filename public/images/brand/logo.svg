<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 0 232 152" width="232" height="152" role="img" aria-label="vea intime">
  <title>véa intime</title>

  <!-- The two petals that stand in for the acute accent over the "e". -->
  <g fill="#ee4e88">
    <path d="M152 6c8 14 10 26 6 38-10-10-12-26-6-38Z"/>
    <path d="M181 17c1 14-6 26-20 30 2-14 8-25 20-30Z"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="103" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Segoe UI', serif"
        font-size="104" fill="#26356f">vea</text>

  <!-- Sub-line: — INTIME —. The text is nudged half a letter-space right to
       cancel the trailing gap after the final E, so it centres on the dashes. -->
  <g stroke="#ee4e88" stroke-width="3.5" stroke-linecap="round">
    <line x1="52" y1="134" x2="86" y2="134"/>
    <line x1="234" y1="134" x2="268" y2="134"/>
  </g>
  <text x="164" y="143" text-anchor="middle"
        font-family="'Segoe UI', Tahoma, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" letter-spacing="7.5" fill="#ee4e88">INTIME</text>
</svg>
